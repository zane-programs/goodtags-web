name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: enable repository package manager
        run: corepack enable
      - name: install dependencies
        run: yarn install --immutable
      - name: lint and unit tests
        run: |
          yarn lint
          yarn test
      - name: validate infrastructure
        run: |
          tofu -chdir=infra fmt -check
          tofu -chdir=infra init -backend=false -input=false
          tofu -chdir=infra validate
      - name: production build
        run: yarn build
      - name: install browsers
        run: yarn playwright install --with-deps chromium webkit
      - name: browser tests
        run: yarn test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/

  # Opt-in: forks and fresh clones stay green without Cloudflare credentials. Set the
  # repository variable CLOUDFLARE_DEPLOY=true and the two secrets to turn it on
  # (see docs/cloudflare-deployment.md).
  deploy-web:
    needs: test-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: enable repository package manager
        run: corepack enable
      - name: install dependencies
        run: yarn install --immutable
      - name: build and deploy the Worker and its static assets
        run: yarn deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  test-py:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'checkout repo'
        uses: 'actions/checkout@v4'
      - name: 'set up python'
        # This is the version of the action for setting up Python, not the Python version.
        uses: 'actions/setup-python@v4'
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 'install pip dependencies'
        run: |
          python -m pip install --upgrade pip==24.0
          pip install -r scripts/requirements.txt
      - name: 'check types'
        run: |
          python -m pyright scripts/fetch_search_database.py
      - name: 'check formatting'
        run: |
          python -m ruff check --diff scripts/fetch_search_database.py
